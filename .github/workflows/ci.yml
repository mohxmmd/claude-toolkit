name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    name: Budget and spec gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Syntax check every script
        run: |
          for file in skills/craft/scripts/*.mjs skills/craft/scripts/lib/*.mjs; do
            node --check "$file"
          done

      - name: Validate manifests
        run: |
          node -e "JSON.parse(require('fs').readFileSync('.claude-plugin/marketplace.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('skills/craft/.claude-plugin/plugin.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('output-styles/.claude-plugin/plugin.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('skills/charter/.claude-plugin/plugin.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('bundles/forge/.claude-plugin/plugin.json','utf8'))"

      - name: Check the installers
        run: |
          sh -n install.sh
          sh -n setup.sh
          ./setup.sh --help > /dev/null
          test -f output-styles/TARS.md
          head -1 output-styles/TARS.md | grep -q '^---$'

      - name: Validate every plugin
        run: |
          npx -y @anthropic-ai/claude-code plugin validate ./skills/charter
          npx -y @anthropic-ai/claude-code plugin validate ./skills/craft
          npx -y @anthropic-ai/claude-code plugin validate ./output-styles
          npx -y @anthropic-ai/claude-code plugin validate ./bundles/forge

      - name: Marketplace agrees with every plugin manifest
        run: |
          node -e '
            const fs = require("fs");
            const mk = JSON.parse(fs.readFileSync(".claude-plugin/marketplace.json", "utf8"));
            let bad = 0;
            for (const p of mk.plugins) {
              const path = p.source.replace(/^\.\//, "") + "/.claude-plugin/plugin.json";
              const m = JSON.parse(fs.readFileSync(path, "utf8"));
              if (m.name !== p.name) { console.error(`name: ${path} says ${m.name}, marketplace says ${p.name}`); bad++; }
              if (m.version !== p.version) { console.error(`version: ${path} says ${m.version}, marketplace says ${p.version}`); bad++; }
            }
            if (bad) process.exit(1);
            console.log(`${mk.plugins.length} plugins agree with the marketplace`);
          '

      - name: Bundle dependencies name real plugins at satisfiable versions
        run: |
          node -e '
            const fs = require("fs");
            const mk = JSON.parse(fs.readFileSync(".claude-plugin/marketplace.json", "utf8"));
            const have = new Map(mk.plugins.map(p => [p.name, p.version]));
            const deps = JSON.parse(fs.readFileSync("bundles/forge/.claude-plugin/plugin.json", "utf8")).dependencies;
            let bad = 0;
            for (const d of deps) {
              if (!have.has(d.name)) { console.error(`dependency ${d.name} is not in the marketplace`); bad++; continue; }
              const want = d.version.replace(/^\^/, "").split(".");
              const got = have.get(d.name).split(".");
              // ^x.y.z on a 0.x line pins the minor, per semver.
              const majorOk = want[0] === got[0];
              const minorOk = want[0] !== "0" || want[1] === got[1];
              if (!majorOk || !minorOk) { console.error(`dependency ${d.name} wants ${d.version}, marketplace has ${have.get(d.name)}`); bad++; }
            }
            if (bad) process.exit(1);
            console.log(`${deps.length} bundle dependencies resolve`);
          '

      - name: Syntax check the CHARTER scripts
        run: |
          for file in skills/charter/scripts/*.sh skills/charter/tests/*.sh \
                      bundles/forge/scripts/*.sh bundles/forge/tests/*.sh \
                      skills/craft/tests/*.sh; do
            bash -n "$file"
          done

      - name: CHARTER budget and behaviour gate
        run: |
          chmod +x skills/charter/scripts/*.sh skills/charter/tests/*.sh
          ./skills/charter/tests/make-fixtures.sh
          ./skills/charter/tests/run.sh

      - name: CRAFT measurement gate
        run: |
          chmod +x skills/craft/tests/run.sh
          ./skills/craft/tests/run.sh

      - name: FORGE doctor gate
        run: |
          chmod +x bundles/forge/scripts/*.sh bundles/forge/tests/*.sh
          ./bundles/forge/tests/run.sh

      - name: Version consistency
        run: node skills/craft/scripts/version.mjs --check

      - name: Budget and spec gate
        run: node skills/craft/scripts/budget.mjs

      - name: Smoke test scripts against this repository
        run: |
          node skills/craft/scripts/context.mjs --target README.md
          node skills/craft/scripts/measure.mjs --root . > /dev/null
          node skills/craft/scripts/inspect.mjs README.md > /dev/null
